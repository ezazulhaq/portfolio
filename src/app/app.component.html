<!-- Skip Link for Keyboard Accessibility -->
<a href="#main" class="skip-link">Skip to main content</a>

<!-- Mobile Navigation Toggle Button -->
<button type="button"
        class="mobile-nav-toggle d-xl-none"
        [attr.aria-expanded]="isMobileNavActive"
        aria-controls="header"
        aria-label="Toggle navigation menu"
        (click)="toggleMobileNav()">
    <i class="bi" [class.bi-list]="!isMobileNavActive" [class.bi-x]="isMobileNavActive"></i>
</button>

<!-- Mobile Navigation Backdrop Overlay -->
<div class="mobile-nav-backdrop"
     [class.active]="isMobileNavActive"
     (click)="closeMobileNav()"
     aria-hidden="true"></div>

<!-- Sidebar Header -->
<app-header></app-header>

<!-- Hero Section -->
<app-hero></app-hero>

<!-- Main Landmark -->
<main id="main" tabindex="-1">

  <app-about></app-about>

  <app-skills></app-skills>

  <app-resume></app-resume>

  <app-contact></app-contact>

</main><!-- End #main -->

<!-- Footer -->
<app-footer></app-footer>

<!-- Back to Top Button -->
<button type="button"
        class="back-to-top"
        [class.active]="showBackToTop"
        (click)="scrollToTop()"
        aria-label="Back to top">
    <i class="bi bi-arrow-up-short"></i>
</button>

<router-outlet></router-outlet>
